name: Build Box64 Android (Stable + Steam Wrapper)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake make python3 wget unzip

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -qq android-ndk-r26b-linux.zip
          echo "BOX64_COMPILER=$PWD/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" >> $GITHUB_ENV
          # Mantido o padrão estável que funcionou para você
          echo "BOX64_PLATFORM_MACRO=-DANDROID=1 -DARM_DYNAREC=1" >> $GITHUB_ENV

      - name: Get Short Commit Hash
        id: git-info
        run: echo "SHORT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Box64 (Release)
        run: |
          mkdir build
          cd build
          
          # Flags do seu txt: RelWithDebInfo para performance com debug
          cmake .. -DCMAKE_C_COMPILER=${{ env.BOX64_COMPILER }} \
                   ${{ env.BOX64_PLATFORM_MACRO }} \
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                   -DHAVE_TRACE=0 \
                   -DZYDIS3=0 \
                   -DSTATICBUILD=0 \
                   -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON
                   
          make -j$(nproc)

      - name: "Package Rat File with Steam Script"
        run: |
          cd build
          mkdir -p files/usr/bin
          
          # 1. Copia o binário compilado
          cp box64 files/usr/bin/

          # 2. CRIA O SCRIPT STEAM WRAPPER (A parte que faltava do txt)
          # Isso cria o arquivo box64-steam que define o LD_PRELOAD
          cat <<EOF > files/usr/bin/box64-steam
          #!/bin/sh
          # Wrapper script baseado no tutorial Box64 Steam API
          
          # Define onde o Box64 vai procurar a DLL "falsa" da Steam
          # No Android/Winlator, $HOME geralmente é /home/xuser
          export BOX64_PRELOAD_DLL="\$HOME/steam_dlls/steam_api.dll"
          
          # Executa o box64 real passando os argumentos
          exec /usr/bin/box64 "\$@"
          EOF

          # Torna o script executável
          chmod +x files/usr/bin/box64-steam

          # Cria o cabeçalho do pacote MiceWine/Winlator
          echo "name=Box64 (Steam Fix)" > pkg-header
          echo "category=Box64" >> pkg-header
          echo "version=${SHORT_COMMIT}" >> pkg-header
          echo "architecture=aarch64" >> pkg-header

          # Compacta tudo
          7z -tzip -mx=5 a box64-android-steam.rat files pkg-header

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box64-android-steam
          path: build/box64-android-steam.rat
