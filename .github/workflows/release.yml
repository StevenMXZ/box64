name: Build Box64 (Winlator Bionic)

on:
  workflow_dispatch:

jobs:
  build-android-bionic:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake make python3 wget unzip

      - name: Setup Android NDK
        # Configuração retirada do seu release.yml original para garantir ambiente Android
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -qq android-ndk-r26b-linux.zip
          # Define o compilador Clang do NDK
          echo "BOX64_COMPILER=$PWD/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" >> $GITHUB_ENV
          # Flags cruciais para Winlator Bionic: DANDROID=1 e DARM_DYNAREC=1
          echo "BOX64_PLATFORM_MACRO=-DANDROID=1 -DARM_DYNAREC=1 -DBAD_SIGNAL=1" >> $GITHUB_ENV

      - name: Get Short Commit Hash
        id: git-info
        run: echo "SHORT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Box64
        run: |
          mkdir build
          cd build
          
          # Usando RelWithDebInfo conforme o seu arquivo .txt
          cmake .. -DCMAKE_C_COMPILER=${{ env.BOX64_COMPILER }} \
                   ${{ env.BOX64_PLATFORM_MACRO }} \
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                   -DHAVE_TRACE=1 \
                   -DZYDIS3=0 \
                   -DSTATICBUILD=0 \
                   -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON
                   
          make -j$(nproc)

      - name: Package WCP for Winlator
        run: |
          cd build
          
          # Criação do JSON de perfil para o Winlator reconhecer o pacote
          cat <<EOF > profile.json
          {
            "type": "Box64",
            "versionName": "bionic-${SHORT_COMMIT}",
            "versionCode": 1,
            "description": "Box64 (Bionic/NDK) build ${SHORT_COMMIT}. Optimized for standard Winlator.",
            "files": [
              {
                "source": "box64",
                "target": "\${localbin}/box64"
              }
            ]
          }
          EOF
          
          # Compacta em formato .wcp (Zstandard)
          # Nota: Não usamos patchelf aqui pois queremos o linker nativo do Android
          tar --zstd -cf box64-bionic-${SHORT_COMMIT}.wcp box64 profile.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box64-bionic-wcp
          path: build/box64-*.wcp
